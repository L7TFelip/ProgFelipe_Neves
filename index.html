<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Login | Atlas CEEP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #83E509;
            --green-light: #9bf424;
            --dark: #111111;
            --dark-2: #181818;
            --white: #ffffff;
            --gray: #777777;
            --border: #dedede;
            --background: #050505;
        }

        html, body {
            height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: "Inter", sans-serif;
            background: var(--background);
            color: var(--dark);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;
            position: relative;
        }


        /* =========================
           FUNDO ANIMADO
        ========================= */

        .background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        /* Gradiente base escuro tipo aurora */
        .bg-gradient {
            position: absolute;
            inset: -10%;
            background:
                radial-gradient(ellipse 900px 600px at 15% 20%, rgba(131,229,9,0.18), transparent 60%),
                radial-gradient(ellipse 800px 700px at 85% 15%, rgba(131,229,9,0.10), transparent 55%),
                radial-gradient(ellipse 900px 800px at 50% 100%, rgba(131,229,9,0.14), transparent 60%),
                #050505;
            background-size: 200% 200%, 200% 200%, 200% 200%, auto;
            animation: gradientShift 22s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
            50% { background-position: 30% 30%, 70% 20%, 60% 80%, 0 0; }
            100% { background-position: 0% 0%, 100% 0%, 50% 100%, 0 0; }
        }

        /* Grade sutil de pontos, deslizando devagar */
        .bg-grid {
            position: absolute;
            inset: -50px;
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 34px 34px;
            animation: gridDrift 40s linear infinite;
            opacity: 0.6;
        }

        @keyframes gridDrift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-34px, -34px); }
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.28;
            will-change: transform, border-radius;
        }

        .circle-1 {
            width: 420px;
            height: 420px;

            background: var(--green);

            top: -150px;
            left: -100px;

            animation: float 8s ease-in-out infinite, drift1 26s ease-in-out infinite, blobMorph 12s ease-in-out infinite;
        }

        .circle-2 {
            width: 360px;
            height: 360px;

            background: var(--green-light);

            right: -120px;
            bottom: -120px;

            opacity: 0.16;

            animation: float 10s ease-in-out infinite reverse, drift2 30s ease-in-out infinite, blobMorph 15s ease-in-out infinite reverse;
        }

        .circle-3 {
            width: 210px;
            height: 210px;

            background: var(--green);

            right: 25%;
            top: 10%;

            animation: float 7s ease-in-out infinite, pulseGlow 5s ease-in-out infinite;
        }

        .circle-4 {
            width: 260px;
            height: 260px;

            background: var(--green-light);

            left: 8%;
            bottom: 6%;

            opacity: 0.18;

            animation: float 9s ease-in-out infinite reverse, drift3 22s ease-in-out infinite, blobMorph 10s ease-in-out infinite;
        }

        .circle-5 {
            width: 160px;
            height: 160px;

            background: var(--green);

            left: 45%;
            top: -60px;

            opacity: 0.12;

            animation: float 11s ease-in-out infinite;
        }

        @keyframes blobMorph {
            0%, 100% { border-radius: 50%; }
            25% { border-radius: 46% 54% 60% 40% / 55% 45% 55% 45%; }
            50% { border-radius: 60% 40% 45% 55% / 40% 60% 40% 60%; }
            75% { border-radius: 40% 60% 55% 45% / 60% 40% 60% 40%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }

        @keyframes drift1 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(40px, 20px); }
            66% { transform: translate(-20px, 45px); }
        }

        @keyframes drift2 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-35px, -25px); }
            66% { transform: translate(25px, -10px); }
        }

        @keyframes drift3 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.14; transform: scale(1); }
            50% { opacity: 0.28; transform: scale(1.15); }
        }

        /* Feixes de luz varrendo a tela */
        .bg-lines {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .bg-beam {
            position: absolute;
            top: -20%;
            width: 2px;
            height: 140%;
            background: linear-gradient(180deg, transparent, rgba(131,229,9,0.55), transparent);
            filter: blur(1px);
            animation: beamSweep linear infinite;
        }

        .bg-beam:nth-child(1) { animation-duration: 9s; animation-delay: 0s; }
        .bg-beam:nth-child(2) { animation-duration: 13s; animation-delay: -5s; }
        .bg-beam:nth-child(3) { animation-duration: 11s; animation-delay: -2s; }

        @keyframes beamSweep {
            0% { left: -5%; opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { left: 105%; opacity: 0; }
        }

        /* Anéis pulsantes concêntricos */
        .bg-rings {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            pointer-events: none;
        }

        .bg-ring {
            position: absolute;
            top: 0;
            left: 0;
            border: 1px solid rgba(131,229,9,0.18);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ringExpand 6s ease-out infinite;
        }

        .bg-ring:nth-child(2) { animation-delay: 2s; }
        .bg-ring:nth-child(3) { animation-delay: 4s; }

        @keyframes ringExpand {
            0% { width: 0; height: 0; opacity: 0.5; }
            100% { width: 1400px; height: 1400px; opacity: 0; }
        }

        /* Canvas de partículas flutuantes */
        #particleCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }


        /* =========================
           CONTAINER PRINCIPAL
        ========================= */

        .login-container {
            width: min(1100px, 92%);
            min-height: 650px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            background: rgba(15, 15, 15, 0.55);

            backdrop-filter: blur(24px);

            border: 1px solid rgba(131, 229, 9, 0.15);

            border-radius: 28px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                0 0 0 1px rgba(255, 255, 255, 0.03) inset,
                0 0 60px rgba(131, 229, 9, 0.06);

            overflow: hidden;

            position: relative;
            z-index: 1;

            animation: containerEnter 0.8s ease;
        }

        /* linha divisória luminosa entre as duas colunas */
        .login-container::after {
            content: "";
            position: absolute;
            top: 8%;
            bottom: 8%;
            left: 50%;
            width: 1px;
            background: linear-gradient(180deg, transparent, rgba(131,229,9,0.35), transparent);
            z-index: 3;
        }

        @media (max-width: 850px) {
            .login-container::after { display: none; }
        }

        @keyframes containerEnter {

            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================
           ÁREA DO CALENDÁRIO
        ========================= */

        .calendar-area {
            background: linear-gradient(160deg, #131313 0%, #0a0a0a 100%);

            padding: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            overflow: hidden;
        }

        .calendar-area::before {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: var(--green);

            opacity: 0.08;

            top: -150px;
            left: -150px;

            animation: pulseGlow 6s ease-in-out infinite;
        }

        .calendar-area::after {
            content: "";

            position: absolute;

            width: 250px;
            height: 250px;

            border-radius: 50%;

            border: 1px solid rgba(131, 229, 9, 0.2);

            right: -100px;
            bottom: -80px;

            animation: float 9s ease-in-out infinite;
        }


        /* =========================
           CALENDÁRIO
        ========================= */

        .calendar {
            width: 100%;
            max-width: 430px;

            color: white;

            position: relative;
            z-index: 2;

            animation: calendarEnter 1s ease;
        }

        @keyframes calendarEnter {

            from {
                opacity: 0;
                transform: translateX(-30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .calendar-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 35px;
        }

        .calendar-header > div {
            display: flex;

            flex-direction: column;

            text-align: center;
        }

        #monthName {
            font-size: 28px;
            font-weight: 800;
        }

        #year {
            color: var(--green);

            font-size: 14px;

            font-weight: 600;

            margin-top: 4px;
        }


        /* Botões do calendário */

        .calendar-btn {
            width: 42px;
            height: 42px;

            border: 1px solid rgba(255, 255, 255, 0.12);

            background: rgba(255, 255, 255, 0.06);

            color: white;

            border-radius: 12px;

            font-size: 26px;

            cursor: pointer;

            transition: 0.3s;
        }

        .calendar-btn:hover {
            background: var(--green);

            color: black;

            transform: scale(1.08);
        }


        /* Dias da semana */

        .weekdays {
            display: grid;

            grid-template-columns: repeat(7, 1fr);

            margin-bottom: 12px;
        }

        .weekdays span {
            text-align: center;

            font-size: 10px;

            font-weight: 700;

            color: #777;

            letter-spacing: 1px;
        }


        /* Dias */

        .days {
            display: grid;

            grid-template-columns: repeat(7, 1fr);

            gap: 8px;
        }

        .day {
            aspect-ratio: 1;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            font-size: 13px;

            color: #ccc;

            transition: 0.25s;

            cursor: pointer;

            position: relative;
        }

        .day:not(.empty):hover {
            background: rgba(131, 229, 9, 0.12);

            color: white;

            transform: translateY(-3px);
        }

        .day.today {
            background: var(--green);

            color: black;

            font-weight: 800;

            box-shadow:
                0 0 25px rgba(131, 229, 9, 0.45);
        }

        .day.selected {
            background: rgba(131, 229, 9, 0.1);
            border: 1px solid var(--green);
            color: white;
            font-weight: 700;
        }


        /* =========================
           ÁREA DE LOGIN
        ========================= */

        .login-area {
            padding: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            position: relative;
        }

        .login-card {
            width: 100%;
            max-width: 390px;

            animation: loginEnter 0.9s ease;
        }

        @keyframes loginEnter {

            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }


        /* Logo */

        .logo {
            margin-bottom: 22px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            background: var(--green);

            border-radius: 14px;

            font-size: 25px;

            font-weight: 900;

            color: black;

            box-shadow:
                0 8px 25px rgba(131, 229, 9, 0.25);

            animation: logoPulse 4s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 8px 25px rgba(131, 229, 9, 0.25); }
            50% { box-shadow: 0 8px 32px rgba(131, 229, 9, 0.45); }
        }


        /* Título */

        .login-title {
            margin-bottom: 30px;
        }

        .login-title span {
            color: #8a8a8a;

            font-size: 12px;

            text-transform: uppercase;

            letter-spacing: 1.5px;

            font-weight: 600;
        }

        .login-title h1 {
            font-size: 34px;

            margin-top: 6px;

            font-weight: 800;

            letter-spacing: -1px;

            color: #ffffff;
        }

        .login-title p {
            margin-top: 8px;

            color: #8a8a8a;

            font-size: 13px;
        }


        /* =========================
           INPUTS
        ========================= */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 12px;

            font-weight: 700;

            color: #d5d5d5;
        }

        .input-box {
            height: 52px;

            border: 1px solid rgba(255, 255, 255, 0.09);

            border-radius: 13px;

            display: flex;

            align-items: center;

            background: rgba(255, 255, 255, 0.04);

            transition: 0.3s;
        }

        .input-box:focus-within {
            border-color: var(--green);

            box-shadow:
                0 0 0 4px rgba(131, 229, 9, 0.12);

            background: rgba(255, 255, 255, 0.06);
        }

        .input-icon {
            width: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #777;

            font-size: 14px;
        }

        .input-box input {
            flex: 1;

            height: 100%;

            border: none;

            outline: none;

            font-family: inherit;

            font-size: 13px;

            color: #f2f2f2;

            background: transparent;
        }

        .input-box input::placeholder {
            color: #666;
        }

        .show-password {
            border: none;

            background: transparent;

            color: #777;

            cursor: pointer;

            margin-right: 15px;

            transition: 0.2s;
        }

        .show-password:hover {
            color: var(--green);
        }


        /* Erros */

        .error {
            display: block;

            color: #e53935;

            font-size: 10px;

            margin-top: 5px;

            min-height: 12px;
        }


        /* =========================
           OPÇÕES DO LOGIN
        ========================= */

        .login-options {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 24px;

            font-size: 11px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #999;

            cursor: pointer;
        }

        .remember input {
            display: none;
        }

        .remember span {
            width: 16px;
            height: 16px;

            border: 1px solid #3a3a3a;

            border-radius: 5px;

            transition: 0.2s;
        }

        .remember input:checked + span {
            background: var(--green);

            border-color: var(--green);

            box-shadow:
                inset 0 0 0 4px #0f0f0f;
        }

        .login-options a {
            color: #b5b5b5;

            text-decoration: none;

            font-weight: 600;
        }

        .login-options a:hover {
            color: var(--green);
        }


        /* =========================
           BOTÃO ENTRAR
        ========================= */

        .login-button {
            width: 100%;

            height: 53px;

            border: none;

            border-radius: 13px;

            background: var(--green);

            color: #0a0a0a;

            font-family: inherit;

            font-weight: 800;

            font-size: 13px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 12px;

            transition: 0.3s;

            position: relative;
            overflow: hidden;

            box-shadow: 0 8px 24px rgba(131, 229, 9, 0.18);
        }

        .login-button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: skewX(-20deg);
            animation: shine 3.5s ease-in-out infinite;
        }

        @keyframes shine {
            0% { left: -60%; }
            50% { left: 130%; }
            100% { left: 130%; }
        }

        .login-button:hover {
            background: var(--green-light);

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(131, 229, 9, 0.32);
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .arrow {
            font-size: 18px;

            transition: 0.3s;
        }

        .login-button:hover .arrow {
            transform: translateX(5px);
        }


        /* Loading */

        .login-button.loading {
            pointer-events: none;

            opacity: 0.7;
        }

        .login-button.loading span:first-child {
            font-size: 0;
        }

        .login-button.loading span:first-child::after {
            content: "Entrando...";

            font-size: 13px;
        }


        /* =========================
           DIVISOR
        ========================= */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 28px 0;

            color: #666;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1px;
        }

        .divider::before,
        .divider::after {
            content: "";

            height: 1px;

            background: rgba(255, 255, 255, 0.08);

            flex: 1;
        }


        /* =========================
           CRIAR CONTA
        ========================= */

        .create-account {
            text-align: center;

            font-size: 11px;

            color: #777;
        }

        .create-account p {
            margin-bottom: 8px;
        }

        .create-account a {
            color: var(--green);

            font-weight: 800;

            text-decoration: none;

            transition: 0.2s;
        }

        .create-account a:hover {
            color: var(--green-light);
        }


        /* =========================
           NOTIFICAÇÃO
        ========================= */

        .notification {
            position: fixed;

            right: 25px;
            bottom: 25px;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 15px 18px;

            background: #131313;

            border: 1px solid rgba(131, 229, 9, 0.25);

            color: white;

            border-radius: 14px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.5);

            transform: translateY(120px);

            opacity: 0;

            transition: 0.4s;

            z-index: 100;
        }

        .notification.active {
            transform: translateY(0);

            opacity: 1;
        }

        .notification-icon {
            width: 32px;
            height: 32px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background: var(--green);

            color: black;

            font-weight: 900;
        }

        .notification strong {
            font-size: 12px;
        }

        .notification p {
            font-size: 10px;

            color: #aaa;

            margin-top: 3px;
        }


        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 850px) {

            body {
                padding: 30px 0;
            }

            .login-container {
                grid-template-columns: 1fr;

                max-width: 520px;
            }

            .calendar-area {
                min-height: 430px;

                padding: 40px;
            }

            .login-area {
                padding: 40px;
            }
        }


        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .login-container {
                width: 100%;

                border-radius: 22px;
            }

            .calendar-area {
                padding: 30px 20px;
            }

            .login-area {
                padding: 30px 22px;
            }

            .login-title h1 {
                font-size: 27px;
            }

            .day {
                font-size: 11px;
            }

            .days {
                gap: 4px;
            }

            .notification {
                left: 15px;
                right: 15px;

                bottom: 15px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         FUNDO
    ========================= -->

    <div class="background">

        <div class="bg-gradient"></div>
        <div class="bg-grid"></div>

        <canvas id="particleCanvas"></canvas>

        <div class="bg-rings">
            <div class="bg-ring"></div>
            <div class="bg-ring"></div>
            <div class="bg-ring"></div>
        </div>

        <div class="bg-lines">
            <div class="bg-beam" style="left: 12%;"></div>
            <div class="bg-beam" style="left: 48%;"></div>
            <div class="bg-beam" style="left: 78%;"></div>
        </div>

        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
        <div class="circle circle-3"></div>
        <div class="circle circle-4"></div>
        <div class="circle circle-5"></div>

    </div>


    <!-- =========================
         LOGIN
    ========================= -->

    <main class="login-container">


        <!-- CALENDÁRIO -->

        <section class="calendar-area">

            <div class="calendar">

                <div class="calendar-header">

                    <button
                        class="calendar-btn"
                        id="prevMonth"
                        type="button"
                    >
                        ‹
                    </button>


                    <div>

                        <span id="monthName">
                            Setembro
                        </span>

                        <span id="year">
                            2026
                        </span>

                    </div>


                    <button
                        class="calendar-btn"
                        id="nextMonth"
                        type="button"
                    >
                        ›
                    </button>

                </div>


                <div class="weekdays">

                    <span>DOM</span>
                    <span>SEG</span>
                    <span>TER</span>
                    <span>QUA</span>
                    <span>QUI</span>
                    <span>SEX</span>
                    <span>SÁB</span>

                </div>


                <div
                    class="days"
                    id="calendarDays"
                ></div>

            </div>

        </section>


        <!-- LOGIN -->

        <section class="login-area">

            <div class="login-card">


                <!-- LOGO -->

                <div class="logo">

                    <div class="logo-icon">
                        A
                    </div>

                </div>


                <!-- TÍTULO -->

                <div class="login-title">

                    <span>
                        Bem-vindo ao
                    </span>

                    <h1>
                        Atlas CEEP
                    </h1>

                    <p>
                        Organize sua vida escolar.
                    </p>

                </div>


                <!-- FORMULÁRIO -->

                <form id="loginForm">


                    <!-- EMAIL -->

                    <div class="input-group">

                        <label for="email">
                            E-mail
                        </label>

                        <div class="input-box">

                            <span class="input-icon">
                                @
                            </span>

                            <input
                                type="email"
                                id="email"
                                placeholder="Digite seu e-mail"
                                autocomplete="email"
                                required
                            >

                        </div>

                        <small
                            class="error"
                            id="emailError"
                        ></small>

                    </div>


                    <!-- SENHA -->

                    <div class="input-group">

                        <label for="password">
                            Senha
                        </label>

                        <div class="input-box">

                            <span class="input-icon">
                                ●
                            </span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                id="showPassword"
                                aria-label="Mostrar senha"
                            >
                                ◉
                            </button>

                        </div>

                        <small
                            class="error"
                            id="passwordError"
                        ></small>

                    </div>


                    <!-- OPÇÕES -->

                    <div class="login-options">

                        <label class="remember">

                            <input
                                type="checkbox"
                                id="remember"
                            >

                            <span></span>

                            Lembrar de mim

                        </label>


                        <a href="#">
                            Esqueceu a senha?
                        </a>

                    </div>


                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="login-button"
                        id="loginButton"
                    >

                        <span>
                            Entrar
                        </span>

                        <span class="arrow">
                            →
                        </span>

                    </button>

                </form>


                <!-- DIVISOR -->

                <div class="divider">
                    <span>ou</span>
                </div>


                <!-- CRIAR CONTA -->

                <div class="create-account">

                    <p>
                        Ainda não possui uma conta?
                    </p>

                    <a href="#">
                        Criar uma conta
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         NOTIFICAÇÃO
    ========================= -->

    <div
        class="notification"
        id="notification"
    >

        <div class="notification-icon">
            ✓
        </div>

        <div>

            <strong>
                Login realizado!
            </strong>

            <p>
                Bem-vindo ao Atlas CEEP.
            </p>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /* =========================
           PARTÍCULAS DE FUNDO
        ========================= */

        (function () {

            const canvas = document.getElementById("particleCanvas");
            const ctx = canvas.getContext("2d");

            let particles = [];
            let width, height;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            window.addEventListener("resize", resize);
            resize();

            const LINK_DIST = 130;

            function createParticles() {
                const count = Math.min(70, Math.floor((width * height) / 18000));
                particles = [];

                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        r: Math.random() * 1.8 + 0.6,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: (Math.random() - 0.5) * 0.35,
                        alpha: Math.random() * 0.5 + 0.25
                    });
                }
            }

            createParticles();
            window.addEventListener("resize", createParticles);

            function tick() {

                ctx.clearRect(0, 0, width, height);

                /* mover partículas */
                for (const p of particles) {

                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < -10) p.x = width + 10;
                    if (p.x > width + 10) p.x = -10;
                    if (p.y < -10) p.y = height + 10;
                    if (p.y > height + 10) p.y = -10;
                }

                /* linhas de constelação entre pontos próximos */
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {

                        const a = particles[i];
                        const b = particles[j];

                        const dx = a.x - b.x;
                        const dy = a.y - b.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist < LINK_DIST) {

                            const opacity = (1 - dist / LINK_DIST) * 0.18;

                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `rgba(131, 229, 9, ${opacity})`;
                            ctx.lineWidth = 1;
                            ctx.stroke();
                        }
                    }
                }

                /* pontos */
                for (const p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(131, 229, 9, ${p.alpha})`;
                    ctx.fill();
                }

                requestAnimationFrame(tick);
            }

            tick();

        })();


        /* =========================
           PARALLAX SUTIL NOS CÍRCULOS
        ========================= */

        (function () {

            const circles = document.querySelectorAll(".circle");

            window.addEventListener("mousemove", (event) => {

                const cx = window.innerWidth / 2;
                const cy = window.innerHeight / 2;

                const dx = (event.clientX - cx) / cx;
                const dy = (event.clientY - cy) / cy;

                circles.forEach((circle, index) => {

                    const strength = 10 + index * 4;

                    circle.style.marginLeft = `${dx * strength}px`;
                    circle.style.marginTop = `${dy * strength}px`;

                });

            });

        })();


        /* =========================
           CALENDÁRIO
        ========================= */

        const calendarDays =
            document.getElementById("calendarDays");

        const monthName =
            document.getElementById("monthName");

        const yearElement =
            document.getElementById("year");

        const prevMonth =
            document.getElementById("prevMonth");

        const nextMonth =
            document.getElementById("nextMonth");


        let currentDate = new Date();


        const months = [
            "Janeiro",
            "Fevereiro",
            "Março",
            "Abril",
            "Maio",
            "Junho",
            "Julho",
            "Agosto",
            "Setembro",
            "Outubro",
            "Novembro",
            "Dezembro"
        ];


        function renderCalendar() {

            const year =
                currentDate.getFullYear();

            const month =
                currentDate.getMonth();


            monthName.textContent =
                months[month];

            yearElement.textContent =
                year;


            calendarDays.innerHTML = "";


            const firstDay =
                new Date(
                    year,
                    month,
                    1
                ).getDay();


            const daysInMonth =
                new Date(
                    year,
                    month + 1,
                    0
                ).getDate();


            /* Espaços antes do primeiro dia */

            for (
                let i = 0;
                i < firstDay;
                i++
            ) {

                const emptyDay =
                    document.createElement("div");

                emptyDay.classList.add(
                    "day",
                    "empty"
                );

                calendarDays.appendChild(
                    emptyDay
                );
            }


            /* Dias */

            for (
                let day = 1;
                day <= daysInMonth;
                day++
            ) {

                const dayElement =
                    document.createElement("div");


                dayElement.classList.add("day");


                dayElement.textContent =
                    day;


                /* Verificar hoje */

                const today =
                    new Date();


                if (
                    day === today.getDate() &&
                    month === today.getMonth() &&
                    year === today.getFullYear()
                ) {

                    dayElement.classList.add(
                        "today"
                    );

                }


                /* Selecionar dia */

                dayElement.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".day.selected"
                            )
                            .forEach(
                                element => {
                                    element.classList.remove(
                                        "selected"
                                    );
                                }
                            );


                        dayElement.classList.add(
                            "selected"
                        );

                    }
                );


                calendarDays.appendChild(
                    dayElement
                );
            }
        }


        /* Mês anterior */

        prevMonth.addEventListener(
            "click",
            () => {

                currentDate.setMonth(
                    currentDate.getMonth() - 1
                );

                renderCalendar();

            }
        );


        /* Próximo mês */

        nextMonth.addEventListener(
            "click",
            () => {

                currentDate.setMonth(
                    currentDate.getMonth() + 1
                );

                renderCalendar();

            }
        );


        renderCalendar();



        /* =========================
           MOSTRAR SENHA
        ========================= */

        const password =
            document.getElementById("password");

        const showPassword =
            document.getElementById("showPassword");


        showPassword.addEventListener(
            "click",
            () => {

                if (
                    password.type === "password"
                ) {

                    password.type = "text";

                    showPassword.textContent =
                        "◌";

                } else {

                    password.type = "password";

                    showPassword.textContent =
                        "◉";

                }

            }
        );



        /* =========================
           LOGIN
        ========================= */

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const emailError =
            document.getElementById("emailError");

        const passwordError =
            document.getElementById("passwordError");

        const notification =
            document.getElementById("notification");


        loginForm.addEventListener(
            "submit",
            (event) => {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const passwordValue =
                    password.value.trim();


                let valid = true;


                emailError.textContent = "";

                passwordError.textContent = "";


                /* Validar email */

                if (!email) {

                    emailError.textContent =
                        "Digite seu e-mail.";

                    valid = false;

                } else if (
                    !email.includes("@")
                ) {

                    emailError.textContent =
                        "Digite um e-mail válido.";

                    valid = false;

                }


                /* Validar senha */

                if (!passwordValue) {

                    passwordError.textContent =
                        "Digite sua senha.";

                    valid = false;

                } else if (
                    passwordValue.length < 6
                ) {

                    passwordError.textContent =
                        "A senha deve ter pelo menos 6 caracteres.";

                    valid = false;

                }


                if (!valid) {
                    return;
                }


                /* Loading */

                loginButton.classList.add(
                    "loading"
                );


                setTimeout(
                    () => {

                        loginButton.classList.remove(
                            "loading"
                        );


                        notification.classList.add(
                            "active"
                        );


                        setTimeout(
                            () => {

                                notification.classList.remove(
                                    "active"
                                );

                            },
                            3500
                        );

                    },
                    1200
                );

            }
        );

    </script>

</body>
